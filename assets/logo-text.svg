<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title>Remiter logo</title>
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f8f7f3"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
