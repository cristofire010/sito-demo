  </defs>
  <rect width="320" height="80" fill="none" />
  <text x="10" y="55" font-family="Inter, sans-serif" font-size="52" font-weight="800" fill="url(#goldGradient)">REMITER</text>
  <rect x="10" y="54" width="280" height="9" fill="url(#shadow)" opacity="0.35" />
